# Keeps actions and npm dependencies up to date (spec 0005).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /sandbox
    schedule:
      interval: weekly
    commit-message:
      prefix: build
