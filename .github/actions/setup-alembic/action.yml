name: Set up Alembic SDK
description: Builds (or restores from cache) static Release builds of Imath and Alembic.

inputs:
  alembic-version:
    description: Alembic git tag, e.g. 1.8.12
    required: true
  imath-version:
    description: Imath version without the leading "v", e.g. 3.2.3
    required: true
  osx-architectures:
    description: macOS only, e.g. x86_64 to cross-compile on Apple Silicon (default the runner's)
    required: false
    default: ''

outputs:
  prefix:
    description: Install prefix to pass as CMAKE_PREFIX_PATH
    value: ${{ steps.paths.outputs.prefix }}

runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      # Forward slashes on Windows too: CMake treats backslashes as escapes.
      run: |
        workspace='${{ github.workspace }}'
        if command -v cygpath >/dev/null 2>&1; then workspace="$(cygpath -m "$workspace")"; fi
        echo "prefix=$workspace/.deps/alembic-sdk" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.prefix }}
        key: alembic-sdk-${{ runner.os }}-${{ runner.arch }}-alembic${{ inputs.alembic-version }}-imath${{ inputs.imath-version }}-${{ inputs.osx-architectures }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-v3

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OSX_ARCHITECTURES: ${{ inputs.osx-architectures }}
      run: bash scripts/ci/build-alembic.sh "${{ steps.paths.outputs.prefix }}" "${{ inputs.imath-version }}" "${{ inputs.alembic-version }}"
