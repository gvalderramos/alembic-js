<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>alembic-js sandbox</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #1d1f24;
                color: #e6e6e6;
                font:
                    13px/1.4 system-ui,
                    sans-serif;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
            #panel {
                position: absolute;
                top: 12px;
                left: 12px;
                max-width: 340px;
                max-height: calc(100% - 24px);
                overflow: auto;
                background: rgba(20, 22, 26, 0.85);
                border: 1px solid #333;
                border-radius: 6px;
                padding: 10px 14px;
            }
            #panel h1 {
                font-size: 14px;
                margin: 0 0 6px;
            }
            #panel dl {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 2px 10px;
                margin: 0 0 8px;
            }
            #panel dt {
                color: #9aa0a6;
            }
            #panel dd {
                margin: 0;
                word-break: break-all;
            }
            #panel ul {
                margin: 0;
                padding-left: 16px;
            }
            #status {
                position: absolute;
                bottom: 12px;
                left: 12px;
                color: #9aa0a6;
            }
            #timeline {
                position: absolute;
                bottom: 36px;
                left: 12px;
                right: 12px;
                display: none;
                align-items: center;
                gap: 10px;
                background: rgba(20, 22, 26, 0.85);
                border: 1px solid #333;
                border-radius: 6px;
                padding: 6px 10px;
            }
            #timeline input {
                flex: 1;
            }
            #timeline button {
                background: #2b2f36;
                color: #e6e6e6;
                border: 1px solid #444;
                border-radius: 4px;
                padding: 2px 10px;
                cursor: pointer;
            }
            #time {
                font-variant-numeric: tabular-nums;
                min-width: 120px;
                text-align: right;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "/three/build/three.module.js",
                    "three/addons/": "/three/examples/jsm/",
                    "alembic-js/stream": "/alembic-js/stream.mjs"
                }
            }
        </script>
    </head>
    <body>
        <div id="panel">
            <h1>alembic-js sandbox</h1>
            <div id="info">Loading…</div>
        </div>
        <div id="timeline">
            <button id="play">Play</button><input id="scrub" type="range" step="any" /><span id="time"></span>
        </div>
        <div id="status"></div>
        <script type="module">
            import * as THREE from 'three';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
            import { applyFrame, decodeFrames } from 'alembic-js/stream';

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1d1f24);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.2));
            const sun = new THREE.DirectionalLight(0xffffff, 2.5);
            sun.position.set(5, 10, 7);
            scene.add(sun);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const escape = (s) =>
                String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

            const [meta, gltf] = await Promise.all([
                fetch('/scene.json').then((r) => r.json()),
                new GLTFLoader().loadAsync('/scene.glb'),
            ]);
            scene.add(gltf.scene);

            const { info, objects } = meta;
            const depth = (p) => p.split('/').length - 2;
            // Object line plus its user properties and geometry attributes (spec 0006).
            const describe = (o) => {
                const props = Object.entries(o.userProperties ?? {})
                    .map(([k, v]) => `${escape(k)} = ${escape(JSON.stringify(v))}`)
                    .concat((o.attributes ?? []).map((a) => `attr ${escape(a)}`));
                const details = props.length
                    ? `<div style="color:#9aa0a6;font-size:11px;margin-left:12px">${props.join('<br>')}</div>`
                    : '';
                return `<li style="margin-left:${depth(o.path) * 12}px">${escape(o.name)} <span style="color:#9aa0a6">${o.type}</span>${details}</li>`;
            };
            document.getElementById('info').innerHTML = `
            <dl>
                <dt>File</dt><dd>${escape(info.path.split(/[\\/]/).pop())}</dd>
                <dt>Written by</dt><dd>${escape(info.appName)}</dd>
                <dt>Library</dt><dd>${escape(info.libraryVersionString)}</dd>
                <dt>Objects</dt><dd>${info.objectCount}</dd>
                <dt>Animated</dt><dd>${info.hasAnimation}</dd>
            </dl>
            <ul>${objects.map(describe).join('')}</ul>`;

            // Frame the model.
            const box = new THREE.Box3().setFromObject(gltf.scene);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const radius = size.length() / 2;
            camera.position.copy(center).add(new THREE.Vector3(1, 0.6, 1.4).normalize().multiplyScalar(radius * 2.4));
            camera.near = radius / 100;
            camera.far = radius * 100;
            camera.updateProjectionMatrix();
            controls.target.copy(center);

            let triangles = 0;
            gltf.scene.traverse((n) => {
                if (n.isMesh) triangles += n.geometry.index.count / 3;
            });
            document.getElementById('status').textContent =
                `${triangles.toLocaleString()} triangles · drag to orbit, scroll to zoom`;

            // Animation (spec 0008): the server streams frames in the binary frame format, a chunk of
            // frames per request; the page keeps a window of upcoming frames loaded and applies them.
            if (info.hasAnimation) {
                const timeline = document.getElementById('timeline');
                const scrub = document.getElementById('scrub');
                const label = document.getElementById('time');
                const play = document.getElementById('play');
                timeline.style.display = 'flex';
                scrub.min = info.startTime;
                scrub.max = info.endTime;

                const fps = info.fps ?? 24;
                const frameCount = Math.max(1, Math.round((info.endTime - info.startTime) * fps) + 1);
                const CHUNK = 12; // frames per request
                const AHEAD = 48; // prefetch window, in frames
                const frames = new Map(); // frame index -> decoded frame
                const chunks = new Map(); // chunk index -> pending or finished request
                let streamed = 0;
                const frameIndex = (t) => Math.min(frameCount - 1, Math.max(0, Math.round((t - info.startTime) * fps)));
                const loadChunk = (chunk) => {
                    if (chunks.has(chunk)) return;
                    const first = chunk * CHUNK;
                    const count = Math.min(CHUNK, frameCount - first);
                    const from = info.startTime + first / fps;
                    const request = fetch(`/frames?from=${from}&step=${1 / fps}&count=${count}`)
                        .then((r) => (r.ok ? r.arrayBuffer() : Promise.reject(new Error(`HTTP ${r.status}`))))
                        .then((buffer) => {
                            streamed += buffer.byteLength;
                            if (chunks.get(chunk) !== request) return; // evicted while loading
                            decodeFrames(buffer).forEach((frame, i) => frames.set(first + i, frame));
                        })
                        .catch((error) => {
                            console.error(error);
                            chunks.delete(chunk);
                        });
                    chunks.set(chunk, request);
                };
                // Loads the chunks of [index, index + AHEAD) (wrapping, since playback loops) and drops the rest.
                const prefetch = (index) => {
                    const keep = new Set([Math.floor(Math.max(0, index - CHUNK) / CHUNK)]);
                    for (let i = 0; i < Math.min(AHEAD, frameCount); i += CHUNK) {
                        keep.add(Math.floor(((index + i) % frameCount) / CHUNK));
                    }
                    keep.forEach(loadChunk);
                    for (const chunk of chunks.keys()) {
                        if (keep.has(chunk)) continue;
                        chunks.delete(chunk);
                        for (let i = chunk * CHUNK; i < (chunk + 1) * CHUNK; i++) frames.delete(i);
                    }
                };

                let time = info.startTime;
                let shown = -1;
                let playing = false;
                const show = (t) => {
                    time = t;
                    scrub.value = t;
                    const index = frameIndex(t);
                    prefetch(index);
                    const frame = frames.get(index);
                    if (frame && index !== shown) {
                        applyFrame(gltf.scene, frame);
                        shown = index;
                    }
                    const state = frame ? '' : ' · buffering';
                    label.textContent = `${t.toFixed(3)} s · frame ${(t * fps).toFixed(1)}${state}`;
                    document.getElementById('status').textContent =
                        `${triangles.toLocaleString()} triangles · ${(streamed / 1024 / 1024).toFixed(1)} MB streamed · drag to orbit, scroll to zoom`;
                    return Boolean(frame);
                };
                scrub.addEventListener('input', () => show(Number(scrub.value)));
                play.addEventListener('click', () => {
                    playing = !playing;
                    play.textContent = playing ? 'Pause' : 'Play';
                });
                let last = performance.now();
                const tick = () => {
                    const now = performance.now(); // wall clock: rAF timestamps lag when the page is throttled
                    const delta = (now - last) / 1000;
                    last = now;
                    // The clock waits while the current frame is buffering, so no frame is skipped for lack of data.
                    const ready = show(time);
                    if (playing && ready) {
                        const duration = info.endTime - info.startTime;
                        let t = time + delta;
                        if (t > info.endTime) t = info.startTime + ((t - info.startTime) % (duration || 1));
                        time = t;
                    }
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
                show(time);
            }
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            renderer.setAnimationLoop(() => {
                controls.update();
                renderer.render(scene, camera);
            });
            window.__sandboxReady = true;
        </script>
    </body>
</html>
