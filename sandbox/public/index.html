<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>alembic-js sandbox</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #1d1f24;
                color: #e6e6e6;
                font:
                    13px/1.4 system-ui,
                    sans-serif;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
            #panel {
                position: absolute;
                top: 12px;
                left: 12px;
                max-width: 340px;
                max-height: calc(100% - 24px);
                overflow: auto;
                background: rgba(20, 22, 26, 0.85);
                border: 1px solid #333;
                border-radius: 6px;
                padding: 10px 14px;
            }
            #panel h1 {
                font-size: 14px;
                margin: 0 0 6px;
            }
            #panel dl {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 2px 10px;
                margin: 0 0 8px;
            }
            #panel dt {
                color: #9aa0a6;
            }
            #panel dd {
                margin: 0;
                word-break: break-all;
            }
            #panel ul {
                margin: 0;
                padding-left: 16px;
            }
            #status {
                position: absolute;
                bottom: 12px;
                left: 12px;
                color: #9aa0a6;
            }
            #timeline {
                position: absolute;
                bottom: 36px;
                left: 12px;
                right: 12px;
                display: none;
                align-items: center;
                gap: 10px;
                background: rgba(20, 22, 26, 0.85);
                border: 1px solid #333;
                border-radius: 6px;
                padding: 6px 10px;
            }
            #timeline input {
                flex: 1;
            }
            #timeline button {
                background: #2b2f36;
                color: #e6e6e6;
                border: 1px solid #444;
                border-radius: 4px;
                padding: 2px 10px;
                cursor: pointer;
            }
            #time {
                font-variant-numeric: tabular-nums;
                min-width: 120px;
                text-align: right;
            }
        </style>
        <script type="importmap">
            { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
        </script>
    </head>
    <body>
        <div id="panel">
            <h1>alembic-js sandbox</h1>
            <div id="info">Loading…</div>
        </div>
        <div id="timeline">
            <button id="play">Play</button><input id="scrub" type="range" step="any" /><span id="time"></span>
        </div>
        <div id="status"></div>
        <script type="module">
            import * as THREE from 'three';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1d1f24);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.2));
            const sun = new THREE.DirectionalLight(0xffffff, 2.5);
            sun.position.set(5, 10, 7);
            scene.add(sun);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const escape = (s) =>
                String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

            const [meta, gltf] = await Promise.all([
                fetch('/scene.json').then((r) => r.json()),
                new GLTFLoader().loadAsync('/scene.glb'),
            ]);
            scene.add(gltf.scene);

            const { info, objects } = meta;
            const depth = (p) => p.split('/').length - 2;
            // Object line plus its user properties and geometry attributes (spec 0006).
            const describe = (o) => {
                const props = Object.entries(o.userProperties ?? {})
                    .map(([k, v]) => `${escape(k)} = ${escape(JSON.stringify(v))}`)
                    .concat((o.attributes ?? []).map((a) => `attr ${escape(a)}`));
                const details = props.length
                    ? `<div style="color:#9aa0a6;font-size:11px;margin-left:12px">${props.join('<br>')}</div>`
                    : '';
                return `<li style="margin-left:${depth(o.path) * 12}px">${escape(o.name)} <span style="color:#9aa0a6">${o.type}</span>${details}</li>`;
            };
            document.getElementById('info').innerHTML = `
            <dl>
                <dt>File</dt><dd>${escape(info.path.split(/[\\/]/).pop())}</dd>
                <dt>Written by</dt><dd>${escape(info.appName)}</dd>
                <dt>Library</dt><dd>${escape(info.libraryVersionString)}</dd>
                <dt>Objects</dt><dd>${info.objectCount}</dd>
                <dt>Animated</dt><dd>${info.hasAnimation}</dd>
            </dl>
            <ul>${objects.map(describe).join('')}</ul>`;

            // Frame the model.
            const box = new THREE.Box3().setFromObject(gltf.scene);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const radius = size.length() / 2;
            camera.position.copy(center).add(new THREE.Vector3(1, 0.6, 1.4).normalize().multiplyScalar(radius * 2.4));
            camera.near = radius / 100;
            camera.far = radius * 100;
            camera.updateProjectionMatrix();
            controls.target.copy(center);

            let triangles = 0;
            gltf.scene.traverse((n) => {
                if (n.isMesh) triangles += n.geometry.index.count / 3;
            });
            document.getElementById('status').textContent =
                `${triangles.toLocaleString()} triangles · drag to orbit, scroll to zoom`;

            // Animation (spec 0004): the server samples frames with AbcPlayer; the page applies them.
            const byPath = new Map();
            gltf.scene.traverse((n) => {
                if (n.userData.alembic?.path) byPath.set(n.userData.alembic.path, n);
            });
            const decode = (b64, Type) => {
                const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
                return new Type(bytes.buffer);
            };
            const applyFrame = ({ objects }) => {
                for (const [path, data] of Object.entries(objects)) {
                    const node = byPath.get(path);
                    if (!node) continue;
                    if (data.matrix) {
                        new THREE.Matrix4()
                            .fromArray(data.matrix)
                            .decompose(node.position, node.quaternion, node.scale);
                    } else if (data.positions && node.geometry) {
                        const geometry = node.geometry;
                        const positions = decode(data.positions, Float32Array);
                        const current = geometry.getAttribute('position');
                        if (current && current.array.length === positions.length && !data.indices) {
                            current.array.set(positions);
                            current.needsUpdate = true;
                        } else {
                            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                        }
                        if (data.normals)
                            geometry.setAttribute(
                                'normal',
                                new THREE.BufferAttribute(decode(data.normals, Float32Array), 3),
                            );
                        if (data.indices)
                            geometry.setIndex(new THREE.BufferAttribute(decode(data.indices, Uint32Array), 1));
                        geometry.computeBoundingSphere();
                    }
                }
            };

            if (info.hasAnimation) {
                const timeline = document.getElementById('timeline');
                const scrub = document.getElementById('scrub');
                const label = document.getElementById('time');
                const play = document.getElementById('play');
                timeline.style.display = 'flex';
                scrub.min = info.startTime;
                scrub.max = info.endTime;
                let time = info.startTime;
                let playing = false;
                let pending = false;
                const show = async (t) => {
                    time = t;
                    scrub.value = t;
                    label.textContent = `${t.toFixed(3)} s${info.fps ? ` · frame ${(t * info.fps).toFixed(1)}` : ''}`;
                    if (pending) return; // drop frames while the previous one is loading
                    pending = true;
                    try {
                        applyFrame(await fetch(`/frame?time=${t}`).then((r) => r.json()));
                    } finally {
                        pending = false;
                    }
                };
                scrub.addEventListener('input', () => show(Number(scrub.value)));
                play.addEventListener('click', () => {
                    playing = !playing;
                    play.textContent = playing ? 'Pause' : 'Play';
                });
                let last = performance.now();
                const tick = (now) => {
                    const delta = (now - last) / 1000;
                    last = now;
                    if (playing && !pending) {
                        const duration = info.endTime - info.startTime;
                        let t = time + delta;
                        if (t > info.endTime) t = info.startTime + ((t - info.startTime) % (duration || 1));
                        show(t);
                    }
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
                show(time);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            renderer.setAnimationLoop(() => {
                controls.update();
                renderer.render(scene, camera);
            });
            window.__sandboxReady = true;
        </script>
    </body>
</html>
